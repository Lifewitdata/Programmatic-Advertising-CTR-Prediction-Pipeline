name: Verify advertising analytics
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: python -m src.run_pipeline --n-impressions 25000
      - run: npm ci
      - run: python scripts/prepare_postgres.py
      - run: node scripts/verify_postgres.mjs
      - run: python scripts/build_tableau.py
      - run: python scripts/execute_notebooks.py
      - run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: verified-synthetic-demo
          path: reports/current/
