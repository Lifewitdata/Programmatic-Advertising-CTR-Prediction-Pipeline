<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#5fa8d3"/>
    </marker>
  </defs>

  <rect width="900" height="200" fill="url(#bg)" rx="10"/>

  <text x="450" y="34" text-anchor="middle" fill="#e0e1dd" font-size="19" font-weight="bold">
    Programmatic Advertising CTR Prediction Platform
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="450" y="54" text-anchor="middle" fill="#778da9" font-size="12">
    end-to-end: synthetic data &#8594; PostgreSQL &#8594; ETL &#8594; features &#8594; models &#8594; serving
  </text>

  <!-- pipeline connecting line -->
  <line x1="60" y1="140" x2="840" y2="140" stroke="#415a77" stroke-width="2"/>

  <!-- traveling pulse -->
  <circle r="6" fill="#5fa8d3">
    <animateMotion dur="6s" repeatCount="indefinite" path="M60,140 L840,140"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- stage nodes -->
  <g font-size="11" fill="#e0e1dd" text-anchor="middle">
    <!-- Data -->
    <g>
      <circle cx="60" cy="140" r="22" fill="#1b263b" stroke="#5fa8d3" stroke-width="2">
        <animate attributeName="stroke" values="#415a77;#5fa8d3;#415a77" dur="6s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <text x="60" y="144">Data</text>
      <text x="60" y="175" fill="#778da9" font-size="10">1M+ rows</text>
    </g>
    <!-- Postgres -->
    <g>
      <circle cx="216" cy="140" r="22" fill="#1b263b" stroke="#415a77" stroke-width="2">
        <animate attributeName="stroke" values="#415a77;#5fa8d3;#415a77" dur="6s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text x="216" y="144">SQL</text>
      <text x="216" y="175" fill="#778da9" font-size="10">6 tables</text>
    </g>
    <!-- ETL -->
    <g>
      <circle cx="372" cy="140" r="22" fill="#1b263b" stroke="#415a77" stroke-width="2">
        <animate attributeName="stroke" values="#415a77;#5fa8d3;#415a77" dur="6s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <text x="372" y="144">ETL</text>
      <text x="372" y="175" fill="#778da9" font-size="10">17 checks</text>
    </g>
    <!-- Features -->
    <g>
      <circle cx="528" cy="140" r="22" fill="#1b263b" stroke="#415a77" stroke-width="2">
        <animate attributeName="stroke" values="#415a77;#5fa8d3;#415a77" dur="6s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <text x="528" y="144">Feats</text>
      <text x="528" y="175" fill="#778da9" font-size="10">84 built</text>
    </g>
    <!-- Models -->
    <g>
      <circle cx="684" cy="140" r="22" fill="#1b263b" stroke="#415a77" stroke-width="2">
        <animate attributeName="stroke" values="#415a77;#5fa8d3;#415a77" dur="6s" begin="4s" repeatCount="indefinite"/>
      </circle>
      <text x="684" y="144">Models</text>
      <text x="684" y="175" fill="#778da9" font-size="10">5 compared</text>
    </g>
    <!-- Serving -->
    <g>
      <circle cx="840" cy="140" r="22" fill="#1b263b" stroke="#415a77" stroke-width="2">
        <animate attributeName="stroke" values="#415a77;#5fa8d3;#415a77" dur="6s" begin="5s" repeatCount="indefinite"/>
      </circle>
      <text x="840" y="144">Serve</text>
      <text x="840" y="175" fill="#778da9" font-size="10">CatBoost</text>
    </g>
  </g>
</svg>
